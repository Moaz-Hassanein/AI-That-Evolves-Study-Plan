<!DOCTYPE html>
<html lang="en">
<head>
    <title>EvoStudy - Smart Study Planner</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EvoStudy is an AI-driven study planning system that evolves personalized study schedules over time using a Genetic Algorithm.">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/spec.css">
    <link rel="stylesheet" href="../CSS/app.css">
</head>

<body class="p-4 md:p-8 bg-slate-50">

<div class="max-w-6xl mx-auto">

    <!-- HEADER -->
    <header class="flex items-center justify-between mb-10">
        <div class="flex items-center gap-4">

            <!-- Brand Icon -->
            <div class="w-14 h-14 flex items-center justify-center brand-icon">
                <i class="fas fa-calendar-check text-2xl"></i>
            </div>

            <div>
                <h1 class="text-3xl font-extrabold text-brand-900">EvoStudy</h1>
                <p class="text-secondary font-medium">Smart Personalized Planning</p>
            </div>
        </div>

        <!-- Brand Badge -->
        <span class="px-4 py-2 text-xs brand-badge">
            <i class="fas fa-robot mr-1"></i> Smart Engine Ready
        </span>
    </header>


    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- MAIN -->
        <div class="lg:col-span-2 p-8 surface-card">

            <!-- STEPPER -->
            <div class="flex justify-center items-center gap-4 mb-10">
                <div id="step-dot-1" class="step-dot active">1</div>
                <div class="w-20 h-1 bg-slate-200 rounded"></div>
                <div id="step-dot-2" class="step-dot">2</div>
            </div>

            <form id="evo-form">

                <!-- STEP 1 -->
                <div id="step-1" class="step-content active">
                    <h2 class="text-xl font-bold mb-6">Mental & Time Capacity</h2>

                    <label class="font-bold">Fatigue Level</label>
                    <input id="fatigueLevel" type="range" min="1" max="10" value="5"
                           class="custom-range w-full">
                    <div id="fatigue-val"
                         class="font-bold text-orange-600 mb-4">5</div>

                    <label class="font-bold">Daily Hours</label>
                    <input id="dailyHours" type="range" min="1" max="16" step="0.5" value="4"
                           class="custom-range w-full">
                    <div id="study-hours-val"
                         class="font-bold text-brand-900 mb-4">4h</div>

                    <input id="planName"
                           placeholder="Study Goal Name"
                           class="w-full input-field mb-4">

                    <input id="totalWeeks"
                           type="number"
                           value="4"
                           class="w-full input-field mb-6">

                    <button type="button"
                            onclick="goToStep(2)"
                            class="px-6 py-3 btn-primary">
                        Next
                    </button>
                </div>


                <!-- STEP 2 -->
                <div id="step-2" class="step-content">
                    <h2 class="text-xl font-bold mb-6">Subjects</h2>

                    <div id="subjects-container" class="space-y-4 mb-4">
                        <div class="subject-card">
                            <input class="input-mini" placeholder="Subject name">
                            <select class="input-mini">
                                <option value="1">Easy</option>
                                <option value="2" selected>Medium</option>
                                <option value="3">Hard</option>
                            </select>
                            <button onclick="this.parentElement.remove(); updateInsights()">🗑</button>
                        </div>
                    </div>

                    <button type="button"
                            onclick="addSubjectRow()"
                            class="px-4 py-2 btn-secondary-soft mb-6">
                        + Add Subject
                    </button>

                    <div class="flex justify-between">
                        <button type="button" onclick="goToStep(1)">
                            Back
                        </button>

                        <button type="submit"
                                class="px-6 py-3 btn-primary">
                            Generate Plan
                        </button>
                    </div>
                </div>

            </form>
        </div>


        <!-- SIDEBAR -->
        <div class="p-8 surface-sidebar">
            <h3 class="font-bold mb-6">Summary</h3>

            <p>Total Hours: <span id="total-hours-display">0h</span></p>
            <p>Topics: <span id="gene-count">1</span></p>
            <p>Fatigue Bias: <span id="fatigue-multiplier">1.0x</span></p>

            <p id="complexity-desc"
               class="mt-4 text-sm text-muted-dark">
                Waiting for configuration...
            </p>
        </div>

    </div>
</div>

<script src="../JS/App.js"></script>
</body>
</html>
